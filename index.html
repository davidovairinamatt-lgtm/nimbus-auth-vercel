<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimbus Auth</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070910; color: #e9edf8; font-family: "Segoe UI", system-ui, sans-serif; }
    main { width: min(560px, 90vw); padding: 28px; border-radius: 16px; background: #0c0f18; border: 1px solid rgba(255,255,255,.08); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { color: #8e97af; font-size: 14px; line-height: 1.5; }
    code { color: #9ff5ec; }
    .ok { color: #4be38a; }
  </style>
</head>
<body>
  <main>
    <h1>Nimbus Auth Server</h1>
    <p class="ok">Сервер аккаунтов работает.</p>
    <p>Проверка состояния: <code>/api/health</code></p>
    <p>Регистрация и вход выполняются из лаунчера и с сайта Nimbus.</p>
  </main>
</body>
</html>
